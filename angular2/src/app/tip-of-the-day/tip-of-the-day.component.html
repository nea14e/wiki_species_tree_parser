<div class="container-fluid">
  <div class="row">
    <h3>{{ rootData.translationRoot()?.translations?.tip_of_the_day_word }}</h3>
    <div class="btn col-auto mr-2 mt-2" (click)="onCloseClick()">
      <img src="/from-bootstrap/x.svg"
           [alt]="rootData.translationRoot()?.translations?.close"
           class="btn-img"/>
    </div>
  </div>

  <div class="row">
    @if (!!tip()?.image_url) {
      <div class="col-auto">
        <img [src]="tip()?.image_url" alt="">
      </div>
    }
    <div class="col-auto d-flex">
      <p class="col-8 font-weight-bold align-self-center">{{ tip()?.tip_text }}</p>
    </div>
  </div>

  <div class="row ml-0 mr-0">
    <div class="btn col-auto mr-2 mt-2"
         [title]="rootData.translationRoot()?.translations?.show_in_tree"
         (click)="isShowInTreeDisabled() ? $event.stopPropagation() : onShowInTreeClick()"
         [class]="isShowInTreeDisabled() ? 'disabled' : ''">
      <img src="/from-bootstrap/eye.svg"
           [alt]="rootData.translationRoot()?.translations?.show_in_tree"
           class="btn-img"/>
    </div>
    <div class="btn col-auto mr-2 mt-2"
         [title]="rootData.translationRoot()?.translations?.copy_link_to_share"
         (click)="onShareClick()">
      <img src="/from-bootstrap/share.svg"
           [alt]="rootData.translationRoot()?.translations?.copy_link_to_share"
           class="btn-img"/>
    </div>
    <div class="btn col-auto mr-2 mt-2"
         [title]="rootData.translationRoot()?.translations?.next_fact"
         (click)="onNextTipClick()">
      <img src="/from-bootstrap/chevron-double-right.svg"
           [alt]="rootData.translationRoot()?.translations?.next_fact"
           class="btn-img"/>
    </div>
  </div>
</div>
